{{/* Shared CSS/SVG soft reflection. Keep definitions rendered for filter references. */}}
<svg class="glass-filter-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <filter id="cardhaus-soft-reflection" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .025" numOctaves="1" seed="8" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="3" result="map"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="12" xChannelSelector="R" yChannelSelector="G" result="bent"/>
      <feGaussianBlur in="bent" stdDeviation=".65" result="soft"/>
      <feColorMatrix in="map" type="luminanceToAlpha" result="height"/>
      <feSpecularLighting in="height" surfaceScale="3" specularConstant=".3" specularExponent="24" lighting-color="#ffffff" result="shine">
        <feDistantLight azimuth="225" elevation="50"/>
      </feSpecularLighting>
      <feComposite in="shine" in2="soft" operator="in" result="clippedShine"/>
      <feBlend in="soft" in2="clippedShine" mode="screen"/>
    </filter>
  </defs>
</svg>
